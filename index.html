<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Redirector</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4895ef;
      --light-color: #f8f9fa;
      --dark-color: #212529;
      --success-color: #4cc9f0;
      --border-radius: 12px;
      --box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--dark-color);
      line-height: 1.6;
    }
    
    .container {
      background-color: white;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      padding: 40px;
      width: 100%;
      max-width: 600px;
      text-align: center;
      transition: var(--transition);
    }
    
    h1 {
      color: var(--primary-color);
      margin-bottom: 20px;
      font-weight: 600;
    }
    
    .message {
      font-size: 18px;
      margin-bottom: 30px;
      color: var(--dark-color);
    }
    
    .video-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    
    .video-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: var(--transition);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      min-width: 120px;
    }
    
    .video-btn:hover {
      background-color: var(--secondary-color);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }
    
    .video-btn:active {
      transform: translateY(0);
    }
    
    .loader {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(67, 97, 238, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary-color);
      animation: spin 1s ease-in-out infinite;
      margin: 20px 0;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .logo {
      margin-bottom: 30px;
      font-size: 24px;
      font-weight: 600;
      color: var(--primary-color);
    }
    
    .logo span {
      color: var(--accent-color);
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .message {
        font-size: 16px;
      }
      
      .video-btn {
        padding: 10px 20px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Video<span>Redirector</span></div>
    <h1 id="message">Redirecting to video...</h1>
    <div class="loader" id="loader"></div>
    <div class="video-options" id="videoOptions"></div>
  </div>

  <script>
    const videoMap = {
      "default": ["https://www.youtube.com/playlist?list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l"],
      "folder": ["https://www.youtube.com/watch?v=zC0dwYfPfzk&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=2"],
      "verify": ["https://www.youtube.com/watch?v=nI7sodMgQus&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=3"],
      "company": ["https://www.youtube.com/watch?v=8jXbKU9VCbI&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=4"],
      "add-tinymce": ["https://www.youtube.com/watch?v=wCzg5UIImOQ&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=5"],
      "feed" : ["https://www.youtube.com/watch?v=HGOUT-nWdkQ&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=6"],
      "author": ["https://www.youtube.com/watch?v=MbzsVJWNKR4&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=7"],
      "social-media": ["https://www.youtube.com/watch?v=2ckgBhhiaLY&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=8"],
      "instant-indexing": ["https://www.youtube.com/watch?v=gyl4Yj3-lMU&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=10"],
      "robots": ["https://www.youtube.com/watch?v=48H8BDwmvUk&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=11"],
      "about": ["https://www.youtube.com/watch?v=TF1WGpebbio&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=12"],
      "push-notification": ["https://www.youtube.com/watch?v=3W78kk1CnRU&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=13"],
      "add-Category": ["https://www.youtube.com/watch?v=2HHEKJpSB-0&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=14"],
      "all-Category": ["https://www.youtube.com/watch?v=2HHEKJpSB-0&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=14"],
      "add-Sub-Category": ["https://www.youtube.com/watch?v=lb8tQZw28pk&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=15"],
      "all-Sub-Category": ["https://www.youtube.com/watch?v=lb8tQZw28pk&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=15"],
      "news-article": [
        "https://www.youtube.com/watch?v=x5PQpaa6ipo&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=17",
        "https://www.youtube.com/watch?v=sIBjpr0UchI&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=18"
      ],
      "all-news-article": [
        "https://www.youtube.com/watch?v=x5PQpaa6ipo&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=17",
        "https://www.youtube.com/watch?v=sIBjpr0UchI&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=18"
      ],
      "MOVIE": ["https://www.youtube.com/watch?v=aEIkbo0K1rc&list=PLZQjCBijuqkJRG5DoysulVjkTW9yjB94l&index=26"]
    };

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const videos = videoMap[id] || videoMap["default"];

      if (videos.length === 1) {
        // Small delay to show the loader
        setTimeout(() => {
          window.location.replace(videos[0]);
        }, 1000);
      } else {
        const container = document.getElementById("videoOptions");
        const msg = document.getElementById("message");
        const loader = document.getElementById("loader");
        
        loader.style.display = "none";
        msg.innerText = "Select a video to watch:";
        
        videos.forEach((url, index) => {
          const btn = document.createElement("button");
          btn.className = "video-btn";
          btn.textContent = "Part " + (index + 1);
          btn.onclick = () => {
            btn.innerHTML = '<span class="loader-btn"></span> Loading...';
            btn.style.pointerEvents = "none";
            window.location.href = url;
          };
          container.appendChild(btn);
        });
      }
    };
  </script>
</body>
</html>
